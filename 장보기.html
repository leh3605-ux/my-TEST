<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 집 장보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root {
    --purple-900: #3b1f6b;
    --purple-700: #5b2fa8;
    --purple-500: #7c4ddb;
    --lavender: #c9b6f2;
    --pearl: #fbf8ff;
    --card: rgba(255, 255, 255, 0.72);
    --card-border: rgba(255, 255, 255, 0.9);
    --text: #2a1a4a;
    --muted: #7a6a99;
    --shadow: 0 8px 28px rgba(76, 40, 140, 0.18);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Gowun Dodum", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    color: var(--text);
    background: linear-gradient(160deg, #6a3fc4 0%, #9b7be0 28%, #c9b6f2 58%, #ece4fb 80%, var(--pearl) 100%) fixed;
    min-height: 100vh;
    padding: 24px 16px 48px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }

  header { color: #fff; text-align: center; margin-bottom: 20px; }
  header h1 { margin: 0 0 6px; font-size: 1.9rem; letter-spacing: 0.02em; text-shadow: 0 2px 10px rgba(40, 10, 90, 0.3); }
  .progress-text { font-size: 1rem; opacity: 0.95; }
  .bar { height: 10px; border-radius: 99px; background: rgba(255,255,255,0.35); margin: 10px auto 0; max-width: 360px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, #fff, #f1e9ff); transition: width .35s ease; }

  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  form.add { padding: 14px; display: grid; grid-template-columns: 1fr 90px; gap: 8px; margin-bottom: 18px; }
  form.add input, form.add select, form.add button {
    font: inherit; font-size: 1rem; border-radius: 12px; border: 1.5px solid #ddd0f5; padding: 10px 12px; background: #fff; color: var(--text); min-width: 0;
  }
  form.add input:focus, form.add select:focus { outline: none; border-color: var(--purple-500); box-shadow: 0 0 0 3px rgba(124,77,219,0.18); }
  form.add select { grid-column: 1; }
  form.add button {
    grid-column: 2; background: var(--purple-700); color: #fff; border: none; cursor: pointer; font-weight: bold;
  }
  form.add button:hover { background: var(--purple-900); }

  .group { padding: 14px 16px 8px; margin-bottom: 14px; }
  .group-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .group-head h2 { margin: 0; font-size: 1.1rem; color: var(--purple-900); }
  .count { font-size: 0.85rem; color: var(--purple-700); background: #efe7ff; padding: 3px 10px; border-radius: 99px; }
  .count.done { background: #e6f6ea; color: #2e7d4a; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: center; gap: 10px; padding: 10px 2px;
    border-top: 1px dashed #e4d9f7;
  }
  li:first-child { border-top: none; }
  li label { flex: 1; display: flex; align-items: center; gap: 10px; cursor: pointer; min-width: 0; }
  li input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--purple-700); flex-shrink: 0; cursor: pointer; }
  .name { font-size: 1.05rem; overflow-wrap: anywhere; }
  .qty { font-size: 0.85rem; color: var(--muted); background: #f5f0ff; padding: 2px 8px; border-radius: 8px; white-space: nowrap; }
  li.checked .name { text-decoration: line-through; text-decoration-color: var(--purple-500); color: var(--muted); }
  li.checked { opacity: 0.55; }
  .del {
    border: none; background: transparent; color: #a593c7; font-size: 1.3rem; cursor: pointer; width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0;
  }
  .del:hover { background: #fbe9ef; color: #c2385a; }
  .empty { color: var(--muted); font-size: 0.9rem; padding: 4px 0 10px; }

  .footer { text-align: center; margin-top: 22px; }
  .reset {
    font: inherit; font-size: 1rem; padding: 12px 22px; border-radius: 99px; border: 1.5px solid var(--purple-500);
    background: rgba(255,255,255,0.85); color: var(--purple-700); cursor: pointer; box-shadow: var(--shadow);
  }
  .reset:hover { background: #fff; }
  .note { margin-top: 10px; font-size: 0.8rem; color: var(--muted); }

  @media (max-width: 420px) {
    form.add { grid-template-columns: 1fr 72px; }
    header h1 { font-size: 1.6rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🛒 우리 집 장보기</h1>
    <div class="progress-text" id="progressText"></div>
    <div class="bar"><div id="barFill"></div></div>
  </header>

  <form class="add card" id="addForm" autocomplete="off">
    <input id="nameInput" placeholder="무엇을 살까요? (예: 두부)" required maxlength="40">
    <input id="qtyInput" placeholder="수량" maxlength="10">
    <select id="catInput"></select>
    <button type="submit">추가</button>
  </form>

  <main id="groups"></main>

  <div class="footer">
    <button class="reset" id="resetBtn" type="button">🔄 체크 모두 풀기</button>
    <div class="note">이 브라우저에만 저장돼요</div>
  </div>
</div>

<script>
  const STORAGE_KEY = "jangbogi-checklist-v1";
  const CATEGORIES = [
    { id: "veg", label: "🥬 채소·과일" },
    { id: "meat", label: "🥩 고기·생선" },
    { id: "dairy", label: "🥛 유제품·계란" },
    { id: "grain", label: "🍚 곡물·가공식품" },
    { id: "home", label: "🧻 생활용품" },
    { id: "etc", label: "📦 기타" }
  ];
  const SAMPLE = [
    { name: "양파", qty: "1망", cat: "veg" },
    { name: "사과", qty: "5개", cat: "veg" },
    { name: "돼지고기 앞다리살", qty: "600g", cat: "meat" },
    { name: "우유", qty: "1팩", cat: "dairy" },
    { name: "계란", qty: "30구", cat: "dairy" },
    { name: "두부", qty: "", cat: "grain" },
    { name: "휴지", qty: "1묶음", cat: "home" }
  ];

  let items = load();

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        if (Array.isArray(data)) return data;
      }
    } catch (e) {}
    return SAMPLE.map(s => ({ id: uid(), name: s.name, qty: s.qty, cat: s.cat, checked: false, at: Date.now() }));
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); } catch (e) {}
  }

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function render() {
    const root = document.getElementById("groups");
    root.innerHTML = "";

    CATEGORIES.forEach(cat => {
      const list = items.filter(i => i.cat === cat.id);
      const unchecked = list.filter(i => !i.checked);
      const checked = list.filter(i => i.checked);

      const section = el("section", "group card");
      const head = el("div", "group-head");
      head.appendChild(el("h2", null, cat.label));
      if (list.length) {
        const left = unchecked.length;
        const badge = el("span", "count" + (left === 0 ? " done" : ""), left === 0 ? "다 샀어요 ✓" : left + "개 남음");
        head.appendChild(badge);
      }
      section.appendChild(head);

      if (!list.length) {
        section.appendChild(el("div", "empty", "아직 항목이 없어요"));
      } else {
        const ul = el("ul");
        [...unchecked, ...checked].forEach(item => ul.appendChild(renderItem(item)));
        section.appendChild(ul);
      }
      root.appendChild(section);
    });

    const total = items.length;
    const done = items.filter(i => i.checked).length;
    document.getElementById("progressText").textContent =
      total === 0 ? "목록이 비어 있어요" : total + "개 중 " + done + "개 샀어요";
    document.getElementById("barFill").style.width = total ? (done / total * 100) + "%" : "0";
  }

  function renderItem(item) {
    const li = el("li", item.checked ? "checked" : "");
    const label = el("label");
    const cb = el("input");
    cb.type = "checkbox";
    cb.checked = item.checked;
    cb.addEventListener("change", () => {
      item.checked = cb.checked;
      save();
      render();
    });
    label.appendChild(cb);
    label.appendChild(el("span", "name", item.name));
    if (item.qty) label.appendChild(el("span", "qty", item.qty));
    li.appendChild(label);

    const del = el("button", "del", "×");
    del.type = "button";
    del.title = item.name + " 지우기";
    del.setAttribute("aria-label", item.name + " 지우기");
    del.addEventListener("click", () => {
      items = items.filter(i => i.id !== item.id);
      save();
      render();
    });
    li.appendChild(del);
    return li;
  }

  // 종류 선택 칸 채우기
  const catInput = document.getElementById("catInput");
  CATEGORIES.forEach(c => {
    const o = el("option", null, c.label);
    o.value = c.id;
    catInput.appendChild(o);
  });

  document.getElementById("addForm").addEventListener("submit", e => {
    e.preventDefault();
    const nameInput = document.getElementById("nameInput");
    const qtyInput = document.getElementById("qtyInput");
    const name = nameInput.value.trim();
    if (!name) return;
    items.push({ id: uid(), name, qty: qtyInput.value.trim(), cat: catInput.value, checked: false, at: Date.now() });
    save();
    render();
    nameInput.value = "";
    qtyInput.value = "";
    nameInput.focus();
  });

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (!items.some(i => i.checked)) { alert("체크된 항목이 없어요."); return; }
    if (confirm("체크를 모두 풀까요? 항목은 그대로 남아요.")) {
      items.forEach(i => i.checked = false);
      save();
      render();
    }
  });

  render();
</script>
</body>
</html>
